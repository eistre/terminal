catalogMode: strict
cleanupUnusedCatalogs: true
minimumReleaseAge: 1440
shellEmulator: true
trustLockfile: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - chokidar@4.0.3
  - semver@6.3.1

injectWorkspacePackages: true
syncInjectedDepsAfterScripts:
  - build

packages:
  - apps/*
  - packages/*

overrides:
  # TODO: Remove once drizzle-kit drops @esbuild-kit/esm-loader.
  '@esbuild-kit/core-utils@3.3.2>esbuild': 0.28.2
  # TODO: Remove once fontless supports esbuild 0.28.
  fontless@0.2.1>esbuild: 0.28.2

catalog:
  '@antfu/eslint-config': ^9.5.1
  '@aws-sdk/client-ec2': ^3.1148.0
  '@aws-sdk/client-ecs': ^3.1148.0
  '@aws-sdk/client-secrets-manager': ^3.1148.0
  '@aws-sdk/client-sesv2': ^3.1148.0
  '@azure/arm-containerinstance': ^9.1.0
  '@azure/communication-email': ^1.1.0
  '@azure/core-rest-pipeline': ^1.25.0
  '@azure/identity': ^4.13.3
  '@azure/keyvault-secrets': ^4.11.2
  '@iconify-json/flag': ^1.2.12
  '@iconify-json/lucide': ^1.2.142
  '@kubernetes/client-node': ^1.4.0
  '@nuxt/eslint': ^1.17.0
  '@nuxt/ui': ^4.11.3
  '@nuxtjs/i18n': ^10.6.0
  '@sindresorhus/slugify': ^3.0.1
  '@tiptap/y-tiptap': ^3.0.9
  '@tsconfig/node-ts': ^23.6.4
  '@tsconfig/node24': ^24.0.5
  '@types/lodash-es': ^4.17.12
  '@types/node': ^24.19.1
  '@types/nodemailer': ^8.0.2
  '@types/sortablejs': ^1.15.9
  '@types/ssh2': ^1.15.6
  '@types/sshpk': ^1.17.5
  '@vueuse/nuxt': ^14.4.0
  '@xterm/addon-fit': ^0.11.0
  '@xterm/addon-webgl': ^0.19.0
  '@xterm/xterm': ^6.0.0
  better-auth: ~1.7.7
  drizzle-kit: ^0.31.11
  drizzle-orm: ^0.45.4
  eslint: ^10.12.0
  eslint-plugin-turbo: ^2.11.7
  husky: ^9.1.7
  lodash-es: ^4.18.1
  mysql2: ^3.24.5
  nodemailer: ^9.0.3
  nuxt: ^4.6.0
  p-limit: ^7.3.3
  p-retry: ^8.0.1
  pino: ^10.4.0
  pino-pretty: ^13.2.0
  sortablejs: ^1.15.7
  ssh2: ^1.17.0
  sshpk: ^1.18.0
  tailwindcss: ^4.3.3
  turbo: ^2.11.7
  typescript: ^6.0.3
  vue: ^3.5.43
  vue-router: ^5.4.0
  vue-tsc: ^3.3.12
  zod: ^4.6.5

allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': false
  cpu-features: true
  esbuild: true
  prisma: false
  ssh2: true
  unrs-resolver: true
  vue-demi: true
